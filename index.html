    <script>
        // 全局变量存放从 json 异步获取的数据
        let globalData = { galgames: [], plants: [] };

        window.onload = function() {
            // 1. 设置并显示今天日期
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            document.getElementById('current-date').innerText = `${year}年${month}月${day}日`;

            // 2. 从同级目录读取 data.json
            fetch('./data.json')
                .then(response => {
                    if (!response.ok) throw new Error('无法读取数据文件');
                    return response.json();
                })
                .then(data => {
                    globalData = data;
                    // 【核心改动 1】：同时传入 “月-日” 和 “年-月-日”
                    renderGalgames(`${month}-${day}`, `${year}-${month}-${day}`);
                    renderPlants();
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('galgame-list').innerHTML = `<p class="text-red-500 text-center py-6">数据加载失败，请检查 data.json 格式是否正确。</p>`;
                });
        };

        // 标签页切换逻辑
        function switchTab(tab) {
            ["galgame", "plants"].forEach(t => {
                document.getElementById(`page-${t}`).classList.add('hidden');
                document.getElementById(`btn-${t}`).classList.remove('bg-emerald-700');
            });
            document.getElementById(`page-${tab}`).classList.remove('hidden');
            document.getElementById(`btn-${tab}`).classList.add('bg-emerald-700');
            
            if(tab === 'galgame') document.getElementById('date-card').classList.remove('hidden');
            else document.getElementById('date-card').classList.add('hidden');
        }

        // 【核心改动 2】：修改渲染逻辑，使其同时兼容两种格式
        function renderGalgames(monthDayStr, fullDateStr) {
            const listContainer = document.getElementById('galgame-list');
            
            // 只要 json 里的 date 匹配 “月-日” 或者是精确的 “年-月-日”，都会被筛选出来
            const filtered = globalData.galgames.filter(g => g.date === monthDayStr || g.date === fullDateStr);
            
            if(filtered.length === 0) {
                listContainer.innerHTML = `<p class="text-gray-400 text-center py-6">今天似乎平平淡淡呢……去 data.json 加点事件吧！</p>`;
                return;
            }

            listContainer.innerHTML = filtered.map(g => `
                <div class="relative pl-6">
                    <div class="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full bg-emerald-600 border-4 border-white shadow"></div>
                    <h3 class="text-lg font-bold text-gray-900">${g.title}</h3>
                    <p class="text-gray-600 mt-1">${g.desc}</p>
                </div>
            `).join('');
        }

        // 渲染植物网格
        function renderPlants() {
            const grid = document.getElementById('plants-grid');
            if(globalData.plants.length === 0) {
                grid.innerHTML = `<p class="text-gray-400 text-center py-6 col-span-full">温室里还没有植物...</p>`;
                return;
            }
            grid.innerHTML = globalData.plants.map(p => `
                <div class="bg-white rounded-xl shadow-sm overflow-hidden border border-gray-100 flex flex-col">
                    <img class="h-48 w-full object-cover" src="${p.img}" alt="${p.name}" onerror="this.src='https://images.unsplash.com/photo-1463936575829-25148e1db1b8?w=500'">
                    <div class="p-4 flex-grow">
                        <h2 class="text-lg font-bold text-gray-900 mb-1">${p.name}</h2>
                        <p class="text-gray-600 text-sm leading-relaxed">${p.desc}</p>
                    </div>
                </div>
            `).join('');
        }
    </script>
